name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [14, latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/cache@v6
        with:
          path: node_modules
          key: npm-cache
          restore-keys: npm-cache
      - run: npm install
      # hexo is a peer dependency (^7.1.1 || ^8.0.0). The dev dependency installs Hexo 8, which
      # requires Node.js 20.19 or later, so test the oldest Node.js with Hexo 7.
      - if: matrix.node-version == 14
        run: npm install --no-save hexo@^7.1.1
      - run: npm run build
      - run: npm run test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      - uses: actions/cache@v6
        with:
          path: node_modules
          key: npm-cache
          restore-keys: npm-cache
      - run: npm install
      - run: npm run build
      - run: npm run test-cov
      - uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
